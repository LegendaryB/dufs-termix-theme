name: Release

# Push a tag like v0.1.0 to publish a GitHub release with a zip of assets/.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the theme files are present
        run: |
          for f in index.html index.js index.css custom.js custom.css theme-init.js favicon.ico; do
            test -f "assets/$f" || { echo "missing assets/$f" >&2; exit 1; }
          done

      - name: Build zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="dufs-termix-theme-$TAG"
          mkdir -p "dist/$name"
          cp -r assets/. "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dufs=$(tr -d '[:space:]' < DUFS_VERSION)
          gh release create "$TAG" "dist/dufs-termix-theme-$TAG.zip" \
            --title "$TAG" \
            --generate-notes \
            --notes "Built on dufs $dufs. Unzip and run \`dufs --assets <unzipped folder>\`."
